name: Gerar APK Bot Da 82

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar PWABuilder CLI
        run: npm install -g @pwabuilder/cli

      - name: Gerar APK
        run: |
          pwa package \
            --url "https://junior567cardozo-create.github.io/botda82/botda82.html" \
            --platform android \
            --output ./apk-output

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "📱 Bot Da 82 v${{ github.run_number }}"
          body: |
            ## 📱 Bot Da 82
            1. Baixe o .apk abaixo
            2. Permita fontes desconhecidas
            3. Instale! 🔥
          files: apk-output/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
