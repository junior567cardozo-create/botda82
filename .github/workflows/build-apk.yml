name: Gerar APK Bot Da 82

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: |
          npm install -g @bubblewrap/cli
          sudo apt-get install -y openjdk-17-jdk

      - name: Criar manifest PWA
        run: |
          cat > manifest.json << 'EOF'
          {
            "name": "Bot Da 82",
            "short_name": "Bot Da 82",
            "description": "App oficial da Turma 82 - 8° Ano 2026",
            "start_url": "/botda82/botda82.html",
            "display": "standalone",
            "background_color": "#050714",
            "theme_color": "#050714",
            "orientation": "portrait",
            "icons": [
              {
                "src": "/botda82/menu.jpg",
                "sizes": "512x512",
                "type": "image/jpeg",
                "purpose": "any maskable"
              }
            ]
          }
          EOF

      - name: Criar APK com Bubblewrap
        run: |
          mkdir apk-build && cd apk-build
          bubblewrap init \
            --manifest "https://junior567cardozo-create.github.io/botda82/manifest.json" \
            --directory . \
            --packageId "com.botda82.app" \
            --name "Bot Da 82" \
            --launcherName "Bot Da 82" \
            --themeColor "#050714" \
            --backgroundColor "#050714" \
            --startUrl "/botda82/botda82.html" \
            --iconUrl "https://junior567cardozo-create.github.io/botda82/menu.jpg" \
            --maskableIconUrl "https://junior567cardozo-create.github.io/botda82/menu.jpg"
          bubblewrap build

      - name: Upload APK como Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: "Bot Da 82 v${{ github.run_number }}"
          body: |
            ## 📱 Bot Da 82 - APK
            
            Baixe o APK abaixo e instale no seu Android!
            
            **Como instalar:**
            1. Baixe o arquivo `.apk`
            2. Permita instalação de fontes desconhecidas
            3. Instale e aproveite! 🔥
          files: apk-build/app-release-unsigned.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
