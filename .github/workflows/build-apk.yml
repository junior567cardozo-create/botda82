name: Gerar APK Bot Da 82

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Clonar template TWA
        run: |
          git clone https://github.com/GoogleChromeLabs/svgomg-twa.git apk-src
          cd apk-src

      - name: Configurar app
        run: |
          cd apk-src
          sed -i 's/svgomg.firebaseapp.com/junior567cardozo-create.github.io/g' app/build.gradle
          sed -i 's|/|/botda82/botda82.html|g' app/src/main/res/values/strings.xml || true
          sed -i 's/com.googlesamples.twa/com.botda82.app/g' app/build.gradle
          sed -i 's/SVG OMG/Bot Da 82/g' app/src/main/res/values/strings.xml || true

      - name: Build APK
        run: |
          cd apk-src
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon 2>&1 | tail -20
          find . -name "*.apk"

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "📱 Bot Da 82 v${{ github.run_number }}"
          body: |
            ## 📱 Bot Da 82
            1. Baixe o .apk abaixo
            2. Permita fontes desconhecidas
            3. Instale! 🔥
          files: apk-src/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
