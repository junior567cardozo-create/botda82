name: Gerar APK Bot Da 82

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Configurar Bubblewrap
        run: |
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}' "$JAVA_HOME" "$ANDROID_HOME" > ~/.bubblewrap/config.json

      - name: Init TWA
        run: |
          mkdir apk-build && cd apk-build
          bubblewrap init \
            --manifest "https://junior567cardozo-create.github.io/botda82/manifest.json" \
            --directory . \
            --packageId "com.botda82.app" \
            --name "Bot Da 82" \
            --launcherName "Bot Da 82" \
            --themeColor "#050714" \
            --backgroundColor "#050714" \
            --startUrl "/botda82/botda82.html" \
            --iconUrl "https://junior567cardozo-create.github.io/botda82/menu.jpg" \
            --maskableIconUrl "https://junior567cardozo-create.github.io/botda82/menu.jpg" \
            --skipPwaValidation

      - name: Build APK
        run: cd apk-build && bubblewrap build --skipSigning

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "📱 Bot Da 82 v${{ github.run_number }}"
          body: |
            ## 📱 Bot Da 82
            1. Baixe o .apk abaixo
            2. Permita fontes desconhecidas
            3. Instale e aproveite! 🔥
          files: apk-build/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
