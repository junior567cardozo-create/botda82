name: Gerar APK Bot Da 82

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Instalar SDK 34
        run: yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" 2>/dev/null || true

      - name: Instalar Gradle 8.0
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.0-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/
          echo "/opt/gradle-8.0/bin" >> $GITHUB_PATH

      - name: Criar projeto WebView
        run: |
          mkdir -p android/app/src/main/java/com/botda82/app
          mkdir -p android/app/src/main/assets
          mkdir -p android/app/src/main/res/values
          cp botda82.html android/app/src/main/assets/
          echo "include ':app'" > android/settings.gradle
          cat > android/build.gradle << 'G'
buildscript {
    repositories { google(); mavenCentral() }
    dependencies { classpath 'com.android.tools.build:gradle:8.0.2' }
}
allprojects { repositories { google(); mavenCentral() } }
G
          cat > android/app/build.gradle << 'G'
plugins { id 'com.android.application' }
android {
    compileSdkVersion 34
    namespace 'com.botda82.app'
    defaultConfig {
        applicationId 'com.botda82.app'
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName '1.0'
    }
    buildTypes { debug {}; release { minifyEnabled false } }
}
G
          cat > android/app/src/main/AndroidManifest.xml << 'X'
<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
    <uses-permission android:name="android.permission.INTERNET"/>
    <application android:label="Bot Da 82" android:theme="@android:style/Theme.NoTitleBar.Fullscreen" android:allowBackup="true">
        <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait">
            <intent-filter>
                <action android:name="android.intent.action.MAIN"/>
                <category android:name="android.intent.category.LAUNCHER"/>
            </intent-filter>
        </activity>
    </application>
</manifest>
X
          cat > android/app/src/main/java/com/botda82/app/MainActivity.java << 'J'
package com.botda82.app;
import android.app.Activity;
import android.os.Bundle;
import android.webkit.WebSettings;
import android.webkit.WebView;
import android.webkit.WebViewClient;
public class MainActivity extends Activity {
    private WebView wv;
    @Override
    protected void onCreate(Bundle b) {
        super.onCreate(b);
        wv = new WebView(this);
        WebSettings ws = wv.getSettings();
        ws.setJavaScriptEnabled(true);
        ws.setDomStorageEnabled(true);
        ws.setAllowFileAccessFromFileURLs(true);
        ws.setAllowUniversalAccessFromFileURLs(true);
        wv.setWebViewClient(new WebViewClient());
        wv.loadUrl("file:///android_asset/botda82.html");
        setContentView(wv);
    }
    @Override
    public void onBackPressed() {
        if (wv.canGoBack()) wv.goBack(); else super.onBackPressed();
    }
}
J
          echo '<resources><string name="app_name">Bot Da 82</string></resources>' > android/app/src/main/res/values/strings.xml

      - name: Gerar Gradle Wrapper
        run: cd android && gradle wrapper --gradle-version 8.0 && chmod +x gradlew

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
          find . -name "*.apk" -ls

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "📱 Bot Da 82 v${{ github.run_number }}"
          body: |
            ## 📱 Bot Da 82
            1. Baixe o .apk abaixo
            2. Permita fontes desconhecidas
            3. Instale! 🔥
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
