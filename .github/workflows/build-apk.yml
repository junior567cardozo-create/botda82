name: APK Bot Da 82
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: SDK 34
        run: yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" 2>/dev/null || true
      - name: Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.0-bin.zip -O /tmp/g.zip
          unzip -q /tmp/g.zip -d /opt/
          echo "/opt/gradle-8.0/bin" >> $GITHUB_PATH
      - name: Wrapper
        run: cd android && gradle wrapper --gradle-version 8.0 && chmod +x gradlew
      - name: Build
        run: cd android && ./gradlew assembleDebug --no-daemon
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Bot Da 82 v${{ github.run_number }}"
          body: "1. Baixe o .apk\n2. Permita fontes desconhecidas\n3. Instale!"
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
